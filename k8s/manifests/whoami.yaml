apiVersion: v1
kind: Namespace
metadata:
  name: ${LAB_K8S_NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: ${LAB_K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
    spec:
      containers:
        - name: whoami
          image: ${WHOAMI_IMAGE}
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: ${LAB_K8S_NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Any host name, plain HTTP: proves the ingress path before a certificate exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: ${LAB_K8S_NAMESPACE}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  name: http
