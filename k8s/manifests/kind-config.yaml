# One node. Traefik's NodePorts are published on the lab box's own ports 80 and
# 443 on every interface, because the CryptOS Intermediate fetches the http-01
# challenge from http://<host>:80 and port 80 is fixed by RFC 8555.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
