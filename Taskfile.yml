version: '3'

# The k8s tasks read real lab values from .env (see .env.example). DRY_RUN=1
# prints the commands instead of running them.
env:
  DRY_RUN: '{{.DRY_RUN}}'

tasks:
  k8s:up:
    desc: "[Linux] Create the kind cluster with Traefik, cert-manager and whoami (idempotent)"
    cmds:
      - k8s/up.sh

  k8s:issuer:
    desc: "[Linux] ACME ClusterIssuer for a CryptOS Intermediate and a P-384 Certificate for HOST"
    summary: |
      task k8s:issuer ACME_URL=https://ca.example.org/acme/directory CA_BUNDLE=root.pem HOST=whoami.example.org
      Optional: EAB_KID and EAB_HMAC for an External Account Binding.
    env:
      ACME_URL: '{{.ACME_URL}}'
      CA_BUNDLE: '{{.CA_BUNDLE}}'
      HOST: '{{.HOST}}'
      EAB_KID: '{{.EAB_KID}}'
      EAB_HMAC: '{{.EAB_HMAC}}'
    cmds:
      - k8s/issuer.sh

  k8s:verify:
    desc: "[Linux] Wait for the Certificate, check the served chain up to the CryptOS root, print the serial"
    env:
      CA_BUNDLE: '{{.CA_BUNDLE}}'
      HOST: '{{.HOST}}'
    cmds:
      - k8s/verify.sh

  k8s:renew:
    desc: "[Linux] Force a renewal with cmctl and verify the new serial is served"
    cmds:
      - k8s/renew.sh

  k8s:down:
    desc: "[Linux] Delete the kind cluster"
    cmds:
      - k8s/down.sh

  k8s:check:
    desc: "Offline checks: shellcheck, pins, dry runs, kubeconform, chain checks"
    cmds:
      - k8s/test/run.sh

  opca:init:
    desc: "Create the lab operator CA (OpenSSL, P-384), its delegated OCSP signer and a first CRL"
    cmds:
      - operator-ca/ca.sh init

  opca:issue:
    desc: "Issue an operator cert and PKCS#12 (LEVEL=admin|operator|viewer EMAIL=...)"
    summary: |
      LAB_OPCA_P12_PASS_FILE=<file> task opca:issue LEVEL=admin EMAIL=admin@example.org
      The passphrase (18 bytes or more) comes from LAB_OPCA_P12_PASS_FILE or LAB_OPCA_P12_PASS.
    cmds:
      - operator-ca/ca.sh issue "{{.LEVEL}}" "{{.EMAIL}}"

  opca:revoke:
    desc: "Revoke an operator cert and publish a new CRL (CERT=... [REASON=superseded])"
    cmds:
      - operator-ca/ca.sh revoke "{{.CERT}}" "{{.REASON | default "superseded"}}"

  opca:crl:
    desc: "Publish a new CRL (each is valid for 7 days)"
    cmds:
      - operator-ca/ca.sh crl

  opca:ocsp-signer:
    desc: "Renew the delegated OCSP signer (valid for 30 days)"
    cmds:
      - operator-ca/ca.sh ocsp-signer

  opca:publish:
    desc: "[Linux] Put the CA cert, the CRL and the OCSP responder in the kind cluster"
    cmds:
      - operator-ca/publish.sh

  opca:check:
    desc: "Offline checks for operator-ca/: shellcheck, a throwaway CA, the extension DER, CRL and OCSP"
    cmds:
      - operator-ca/test/run.sh
